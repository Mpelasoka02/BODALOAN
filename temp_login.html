<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — BodaLoan</title>
    <link rel="icon" type="image/svg+xml" href="http://127.0.0.1:8007/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f8fafc;min-height:100vh;display:flex;flex-direction:column}

        .auth-nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 clamp(20px,4vw,48px);height:64px;display:flex;align-items:center;justify-content:space-between}
        .auth-nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#064180;font-weight:800;font-size:1.25rem}
        .auth-nav-brand i{font-size:1.5rem}
        .auth-nav-back{display:flex;align-items:center;gap:6px;color:#64748b;text-decoration:none;font-size:0.88rem;font-weight:600;transition:color .2s}
        .auth-nav-back:hover{color:#064180}

        .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
        .auth-card{width:100%;max-width:420px}
        .auth-header{text-align:center;margin-bottom:32px}
        .auth-logo{width:56px;height:56px;background:#064180;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;margin-bottom:16px}
        .auth-title{font-size:1.6rem;font-weight:800;color:#1e293b;margin-bottom:4px}
        .auth-sub{font-size:0.92rem;color:#94a3b8}

        .role-tabs{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;margin-bottom:24px}
        .role-tab{flex:1;padding:10px 8px;text-align:center;font-size:0.85rem;font-weight:600;color:#64748b;cursor:pointer;background:none;border:none;border-radius:10px;transition:all .2s;font-family:'Inter',sans-serif}
        .role-tab:hover{color:#1e293b}
        .role-tab.active{color:#064180;background:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}

        .field{margin-bottom:18px}
        .field label{display:block;font-size:0.82rem;font-weight:600;color:#475569;margin-bottom:6px}
        .field-input{position:relative}
        .field-input i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:0.95rem;z-index:1}
        .field-input input{width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:13px 14px 13px 44px;font-size:0.9rem;color:#1e293b;background:#fff;transition:all .2s;font-family:'Inter',sans-serif}
        .field-input input:focus{outline:none;border-color:#064180;box-shadow:0 0 0 3px rgba(6,65,128,.1)}

        .field-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:0.82rem}
        .field-row label{display:flex;align-items:center;gap:6px;cursor:pointer;color:#475569;font-weight:500}
        .field-row a{color:#064180;font-weight:600;text-decoration:none}
        .field-row a:hover{text-decoration:underline}

        .btn-primary{width:100%;background:#064180;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn-primary:hover{background:#053060;box-shadow:0 4px 12px rgba(6,65,128,.25)}

        .auth-footer{text-align:center;margin-top:24px;font-size:0.88rem;color:#64748b}
        .auth-footer a{color:#064180;font-weight:700;text-decoration:none}
        .auth-footer a:hover{text-decoration:underline}

        .alert-error{background:#fef2f2;border:1px solid #fecaca;border-left:4px solid #dc2626;border-radius:10px;font-size:0.82rem;padding:12px 16px;margin-bottom:18px;color:#991b1b}
        .alert-info{background:#eff6ff;border:1px solid #bfdbfe;border-left:4px solid #2563eb;border-radius:10px;font-size:0.82rem;padding:12px 16px;margin-bottom:18px;color:#1e40af}
        .alert-success{background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #16a34a;border-radius:10px;font-size:0.82rem;padding:12px 16px;margin-bottom:18px;color:#166534}

        .admin-link{text-align:center;margin-top:12px}
        .admin-link button{background:none;border:none;color:#94a3b8;font-size:0.78rem;cursor:pointer;padding:6px 12px;border-radius:8px;font-family:'Inter',sans-serif;transition:all .2s}
        .admin-link button:hover{color:#064180;background:#f1f5f9}

        .auth-footer-bottom{padding:20px;text-align:center;font-size:0.78rem;color:#94a3b8;border-top:1px solid #e2e8f0;margin-top:auto}
        .auth-footer-bottom a{color:#64748b;text-decoration:none}
    </style>
</head>
<body>
    <nav class="auth-nav">
        <a href="http://127.0.0.1:8007" class="auth-nav-brand"><i class="bi bi-motorcycle"></i> BodaLoan</a>
        <a href="http://127.0.0.1:8007/register" class="auth-nav-back"><i class="bi bi-person-plus"></i> Create Account</a>
    </nav>

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo"><i class="bi bi-motorcycle"></i></div>
                <div class="auth-title">Welcome back</div>
                <div class="auth-sub">Sign in to your BodaLoan account</div>
            </div>

                        <div class="role-tabs" style="">
                <button type="button" class="role-tab active" data-role="owner" onclick="switchTab(this)">
                    <i class="bi bi-building me-1"></i> Owner
                </button>
                <button type="button" class="role-tab " data-role="driver" onclick="switchTab(this)">
                    <i class="bi bi-bicycle me-1"></i> Driver
                </button>
            </div>

                                    
            <form method="POST" action="http://127.0.0.1:8007/login">
                <input type="hidden" name="_token" value="H7YUmb8yUFUKK1dZbdrsXjG8Yel09PHUD2hAsSOc" autocomplete="off">                <input type="hidden" name="login_role" id="loginRole" value="owner">

                <div class="field">
                    <label>Email</label>
                    <div class="field-input">
                        <i class="bi bi-envelope"></i>
                        <input type="email" name="email" placeholder="you@example.com" value="" required autofocus>
                    </div>
                </div>

                <div class="field">
                    <label>Password</label>
                    <div class="field-input">
                        <i class="bi bi-lock"></i>
                        <input type="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="field-row">
                    <label><input type="checkbox" name="remember" style="accent-color:#064180"> Remember me</label>
                    <a href="http://127.0.0.1:8007/forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="http://127.0.0.1:8007/register">Register now</a>
            </div>

            <div class="admin-link">
                <button type="button" onclick="toggleAdmin(this)">
                    <i class="bi bi-shield-lock me-1"></i> Admin Login
                </button>
            </div>
        </div>
    </div>

    <div class="auth-footer-bottom">
        &copy; 2026 BodaLoan &middot; <a href="#">Privacy</a> &middot; <a href="#">Terms</a>
    </div>

<script>
function switchTab(el) {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('loginRole').value = el.dataset.role;
}
function toggleAdmin(btn) {
    const tabs = document.querySelector('.role-tabs');
    const roleInput = document.getElementById('loginRole');
    const footer = document.querySelector('.auth-footer');
    if (tabs.style.display === 'none') {
        tabs.style.display = 'flex';
        footer.style.display = '';
        btn.innerHTML = '<i class="bi bi-shield-lock me-1"></i> Admin Login';
        roleInput.value = document.querySelector('.role-tab.active').dataset.role;
    } else {
        tabs.style.display = 'none';
        footer.style.display = 'none';
        btn.innerHTML = '<i class="bi bi-building me-1"></i> Back to Owner/Driver';
        roleInput.value = 'admin';
    }
}
</script>
</body>
</html>
